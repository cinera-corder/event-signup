<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학과 행사 선착순 신청</title>
<style>
  :root{
    --sage:#2F6B55; --sage-dark:#245440; --blue:#8298B0; --beige:#F6F1E7;
    --white:#fff; --ink:#2E3A35; --sub:#6B756F; --line:#E6DFD0; --err:#B3463C;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--beige); color:var(--ink);
    font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
    line-height:1.5;
  }
  .wrap{max-width:480px; margin:0 auto; padding:24px 16px 48px}
  header{text-align:center; margin-bottom:20px}
  .badge{
    display:inline-block; background:var(--white); color:var(--sage);
    border:1px solid var(--line); border-radius:999px;
    padding:4px 12px; font-size:.8rem; font-weight:700; margin-bottom:8px;
  }
  h1{margin:0; font-size:1.5rem; color:var(--sage-dark)}
  .sub{margin:6px 0 0; color:var(--sub); font-size:.9rem}
  .card{
    background:var(--white); border-radius:20px; padding:20px;
    box-shadow:0 2px 10px rgba(47,107,85,.08); margin-bottom:16px;
  }
  .seats{display:flex; align-items:baseline; justify-content:space-between}
  .seats .label{color:var(--sub); font-size:.9rem}
  .seats .num{font-size:2rem; font-weight:800; color:var(--sage)}
  .seats .num small{font-size:1rem; color:var(--sub); font-weight:600}
  .track{height:10px; background:var(--beige); border-radius:999px; overflow:hidden; margin-top:10px}
  #bar{height:100%; width:0; background:var(--sage); border-radius:999px; transition:width .3s}
  label{display:block; font-size:.85rem; font-weight:700; margin:12px 0 4px}
  input{
    width:100%; padding:12px 14px; font-size:1rem; color:var(--ink);
    border:1.5px solid var(--line); border-radius:12px; background:var(--white);
  }
  input:focus{outline:none; border-color:var(--sage); box-shadow:0 0 0 3px rgba(47,107,85,.15)}
  .btns{display:flex; gap:8px; margin-top:16px}
  button{
    flex:1; padding:13px; font-size:1rem; font-weight:700; border-radius:12px;
    cursor:pointer; border:1.5px solid transparent;
  }
  .primary{background:var(--sage); color:var(--white)}
  .primary:hover{background:var(--sage-dark)}
  .ghost{background:var(--white); color:var(--blue); border-color:var(--blue)}
  .ghost:hover{background:#F1F4F8}
  #msg{min-height:1.5rem; margin:12px 0 0; font-weight:700; text-align:center}
  h2{margin:0 0 12px; font-size:1.05rem; color:var(--sage-dark)}
  ul{list-style:none; margin:0; padding:0}
  li{
    display:flex; align-items:center; gap:12px;
    padding:10px 12px; border-radius:12px; background:var(--beige); margin-bottom:8px;
  }
  li.empty{justify-content:center; color:var(--sub); background:transparent; border:1.5px dashed var(--line)}
  .avatar{
    width:36px; height:36px; border-radius:50%; background:var(--blue); color:var(--white);
    display:flex; align-items:center; justify-content:center; font-weight:800; flex:none;
  }
  .who b{display:block}
  .who span{font-size:.8rem; color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge">선착순 신청</span>
    <h1>학과 행사 선착순 신청</h1>
    <p class="sub">이름과 학번을 입력하고 자리를 신청해 보세요.</p>
  </header>

  <section class="card">
    <div class="seats">
      <span class="label">남은 자리</span>
      <span class="num"><b id="remain">-</b> <small>/ <span id="cap">-</span></small></span>
    </div>
    <div class="track"><div id="bar"></div></div>
  </section>

  <section class="card">
    <label for="nm">이름</label>
    <input id="nm" placeholder="예: 홍길동" autocomplete="off">
    <label for="sid">학번</label>
    <input id="sid" placeholder="숫자 8~10자리" inputmode="numeric" autocomplete="off">
    <div class="btns">
      <button class="primary" onclick="doApply()">신청</button>
      <button class="ghost" onclick="doCancel()">신청 취소 (학번 기준)</button>
    </div>
    <p id="msg" aria-live="polite"></p>
  </section>

  <section class="card">
    <h2>신청자 목록</h2>
    <ul id="list"></ul>
  </section>
</div>
<script>
function render(d){
  document.getElementById('remain').textContent = d.remaining;
  document.getElementById('cap').textContent = d.capacity;
  var used = d.capacity - d.remaining;
  document.getElementById('bar').style.width = (d.capacity ? (used / d.capacity * 100) : 0) + '%';
  const ul = document.getElementById('list');
  ul.replaceChildren();
  if (d.applicants.length === 0) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = '아직 신청자가 없습니다.';
    ul.append(li);
    return;
  }
  d.applicants.forEach(a => {
    const li = document.createElement('li');
    const av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = a.name.charAt(0);
    const who = document.createElement('div');
    who.className = 'who';
    const b = document.createElement('b');
    b.textContent = a.name;
    const s = document.createElement('span');
    s.textContent = a.student_id;
    who.append(b, s);
    li.append(av, who);
    ul.append(li);
  });
}
async function load(){
  const r = await fetch('/api/list');
  render(await r.json());
}
async function send(path, body){
  const r = await fetch(path, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  const d = await r.json();
  const msg = document.getElementById('msg');
  msg.textContent = d.message || d.error;
  msg.style.color = r.ok ? '#2F6B55' : '#B3463C';
  load();
}
function doApply(){
  send('/api/apply', {name: document.getElementById('nm').value,
                      student_id: document.getElementById('sid').value});
}
function doCancel(){
  send('/api/cancel', {student_id: document.getElementById('sid').value});
}
load();
</script>
</body>
</html>
